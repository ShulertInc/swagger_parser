openapi: 3.1.0
info:
  title: Validation
  version: 1.0.0
paths:
  /submissions:
    post:
      operationId: createSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Submission'
      responses:
        '204':
          description: Accepted
    get:
      operationId: searchSubmissions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
        - name: X-Device-Id
          in: header
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 64
              - type: 'null'
        - name: page
          in: query
          required: false
          schema:
            type: integer
      responses:
        '204':
          description: Found
components:
  schemas:
    Submission:
      type: object
      required:
        - name
        - note
        - tags
        - quoted
      properties:
        name:
          type: string
          maxLength: 255
          pattern: \S
        note:
          anyOf:
            - type: string
              maxLength: 1000
            - type: 'null'
        quoted:
          type: string
          minLength: 2
          pattern: ^[^'"$\\]*$
        tags:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        count:
          type: integer
          minimum: 1
          maximum: 10
        startsAt:
          type: string
          format: date-time
          pattern: ^2
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 254
            - type: 'null'
        website:
          type: string
          format: website
