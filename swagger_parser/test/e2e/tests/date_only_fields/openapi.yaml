openapi: 3.1.0
info:
  title: Test API for date-only fields
  version: 1.0.0
paths:
  /schedules:
    post:
      operationId: create_schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Schedule"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
components:
  schemas:
    Schedule:
      type: object
      required: [starts_on, created_at]
      properties:
        starts_on:
          type: string
          format: date
        ends_on:
          anyOf:
            - type: string
              format: date
            - type: "null"
        holidays:
          type: array
          items:
            type: string
            format: date
        created_at:
          type: string
          format: date-time
